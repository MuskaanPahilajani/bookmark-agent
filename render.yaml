services:
  - type: web
    name: bookmark-ai-synchronizer
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python fastapi_bookmarks.py
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: BOOKMARK_STORE_PATH
        value: /var/data/bookmarks.json
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
    disk:
      name: bookmark-data
      mountPath: /var/data
      sizeGB: 1